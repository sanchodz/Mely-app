name: Build Mobile

# Compila Android (APK + AAB) e iOS con el workflow reutilizable local
# (.github/workflows/build-mobile-reusable.yml).
# Los artefactos quedan en la corrida (Actions → esta corrida → Artifacts →
# android-build / ios-build).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-mobile-reusable.yml
    with:
      project_type: pwa
      # Sin los secrets IOS_* (cuenta de Apple Developer) iOS sale como App-unsigned.zip:
      # una .app para el Simulador, que no se instala en un iPhone real.
      build_ios: true
    secrets: inherit
